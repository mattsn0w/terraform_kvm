#cloud-config
# vim: syntax=yaml

meta-data:
  instance-id: ${hostname}
  local-hostname: ${hostname}
fqdn: ${hostname}
hostname: ${hostname}
manage_etc_hosts: true
#ssh_pwauth: yes
users:
  - { name: ubuntu, hashed_passwd: ${passwd_hash}, shell: /usr/bin/bash, lock_passwd: true, ssh_import_id: [ "gh:mattsn0w" ], sudo: ["ALL=(ALL) NOPASSWD:ALL"], groups: [ wheel, users, admin, sudo ] } 
package_update: true
packages:
  - apt-transport-https
  - ca-certificates
  - containerd
  - conmon
  - cloud-initramfs-growroot
  - curl
  - dialog
  - gnupg2
  - gnupg
  - ldap-utils
  - lsb-release
  - lsb-base
  - net-tools
  - nfs-common
  - ntp
  - ntpdate
  - qemu-guest-agent
  - sshpass
  - sysstat
  - systemd-container
  - systemd-timesyncd
  - unzip
  - whois

write_files:
- content: |
    br_netfilter
    overlay
  path: /etc/modules-load.d/containers.conf
  defer: true
  
- content: |
    net.bridge.bridge-nf-call-ip6tables = 1
    net.bridge.bridge-nf-call-iptables = 1
    net.ipv4.ip_forward = 1
  path: /etc/sysctl.d/containers.conf
  defer: true

- content: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBSOnlzr+PjiTS10sZrkfDzXla3kIvgnCe5zvUggJs9q root.co.slakin.net CA
  path: /etc/ssh/ca.pub

- content: TrustedUserCAKeys /etc/ssh/ca.pub
  path: /etc/ssh/sshd_config.d/ca.conf

#runcmd:
#  - [ touch, /etc/cloud/cloud-init.disabled ]
#  - [ apt, remove, cloud-init ]

power_state:
  mode: reboot
  message: Bye Bye
  timeout: 30
  condition: True
