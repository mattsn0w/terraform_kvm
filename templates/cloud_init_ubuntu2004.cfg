#cloud-config
# vim: syntax=yaml
#
# ***********************
# 	---- for more examples look at: ------
# ---> https://cloudinit.readthedocs.io/en/latest/topics/examples.html
# ******************************
#

meta-data:
  instance-id: ${hostname}
  local-hostname: ${hostname}
fqdn: ${hostname}
hostname: ${hostname}
manage_etc_hosts: true

ssh_pwauth: true

chpasswd:
  list: |
     root:${root_pw}
  expire: False
package_update: true
packages:
  - apt-transport-https
  - autofs
  - autofs-ldap
  - ca-certificates
  - cloud-initramfs-growroot
  - conmon
  - containerd
  - curl
  - dialog
  - gnupg
  - gnupg2
  - ldap-utils
  - libldap2-dev
  - libboost-all-dev
  - libpam-ccreds
  - libpam-ldapd
  - libpam-sss
  - lsb-core
  - lsb-release
  - net-tools
  - nfs-common
  - ntp
  - ntpdate
  - qemu-guest-agent
  - sysstat
  - unzip
  - libnl-genl-3-200
#groups:
#  - ${my_user_name}: ${my_user_name}
#users:
#  - default
#  - name: ${my_user_name}
#    uid: 1001
#    sudo: ALL=(ALL) NOPASSWD:ALL
#    groups: wheel, users, admin, sudo
#    homedir: /home/${my_user_name}
#    passwd: ${passwd_hash}
#    lock_passwd: False
#    primary_group: ${my_user_name}
#    shell: /bin/bash
#    ssh_authorized_keys:
#    - ${ssh_pub_key}
write_files:
- content: |
    ${ssh_pub_key}
  path: /root/.ssh/authorized_keys

- content: |
    br_netfilter
    overlay
  path: /etc/modules-load.d/containers.conf
  defer: true
  
- content: |
    net.bridge.bridge-nf-call-ip6tables = 1
    net.bridge.bridge-nf-call-iptables = 1
    net.ipv4.ip_forward = 1
  path: /etc/sysctl.d/containers.conf
  defer: true

runcmd:
#  - [ touch, /etc/cloud/cloud-init.disabled ]
#  - [ apt, remove, cloud-init ]
  - [ export, DEBIAN_FRONTEND=noninteractive ]
  - [ shutdown, -h, now ]

