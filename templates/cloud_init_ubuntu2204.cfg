#cloud-config
# vim: syntax=yaml
#
# ***********************
# 	---- for more examples look at: ------
# ---> https://cloudinit.readthedocs.io/en/latest/topics/examples.html
# ******************************
#

meta-data:
  instance-id: ${hostname}
  local-hostname: ${hostname}
fqdn: ${hostname}
hostname: ${hostname}
manage_etc_hosts: true
ssh_pwauth: yes
chpasswd:
  expire: false
  users:
    - name: root
      password: ${root_pw}
      type: text
#    - name: ubuntu
#      password: ${passwd_hash}
#      type: text
package_update: true
packages:
  - apt-transport-https
  - ca-certificates
  - containerd
  - conmon
  - cloud-initramfs-growroot
  - curl
  - dialog
  - gnupg2
  - gnupg
  - ldap-utils
  - libpam-ldapd
  - libpam-sss
  - libpam-ccreds
  - lsb-release
  - lsb-core
  - net-tools
  - nfs-common
  - ntp
  - ntpdate
  - qemu-guest-agent
  - sshpass
  - sysstat
  - systemd-container
  - unzip
users:
  - default
  - name: ubuntu
    ssh_authorized_keys:
      - ${ssh_pub_key}
groups:
  - ${my_user_name}: ${my_user_name}
users:
  - default
  - name: ${my_user_name}
    uid: 1001
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: wheel, users, admin, sudo
    homedir: /home/${my_user_name}
    passwd: ${passwd_hash}
    lock_passwd: False
    primary_group: ${my_user_name}
    shell: /bin/bash
    ssh_authorized_keys:
    - ${ssh_pub_key}

write_files:
- content: |
    ${ssh_pub_key}
  path: /root/.ssh/authorized_keys

- content: |
    br_netfilter
    overlay
  path: /etc/modules-load.d/containers.conf
  defer: true
  
- content: |
    net.bridge.bridge-nf-call-ip6tables = 1
    net.bridge.bridge-nf-call-iptables = 1
    net.ipv4.ip_forward = 1
  path: /etc/sysctl.d/containers.conf
  defer: true

#runcmd:
#  - [ touch, /etc/cloud/cloud-init.disabled ]
#  - [ apt, remove, cloud-init ]

power_state:
  mode: reboot
  message: Bye Bye
  timeout: 30
  condition: True
